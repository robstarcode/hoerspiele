<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hörspiele</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#fff3d6;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#333;touch-action:manipulation}
#app{min-height:100%;padding:14px 14px 150px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (orientation:landscape){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{border:0;padding:0;background:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.18);overflow:hidden;width:100%;display:block;position:relative;height:0;padding-top:100%}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tile img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile.sel{outline:6px solid #ff8a00}
.tile .sym,.cv .sym{position:absolute;right:8px;bottom:8px;width:80px;height:80px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tile .sym svg,.cv .sym svg{width:100%;height:100%;display:block}
.p .trk{font-size:13px}
.devs{display:flex;gap:12px;justify-content:flex-end;margin:0 0 14px}
.dev{border:0;background:#fff;font-size:44px;width:92px;height:76px;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.18);opacity:.45}
.dev.on{opacity:1;outline:5px solid #2bb673}
.dev:active{transform:translateY(4px)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start}
.tile .tname,.cv .tname{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:22px;font-weight:700;background:#ffd166;color:#333}
.p select{font-size:16px;padding:8px;border-radius:10px;margin:4px 0}
.back{border:0;background:#ff8a00;color:#fff;font-size:54px;line-height:1;width:96px;height:80px;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:0 0 14px}
.back:active{transform:translateY(4px)}
.hint{text-align:center;font-size:18px;padding:40px 20px;color:#777}
.gear{position:fixed;right:0;bottom:0;width:70px;height:70px;opacity:.12;font-size:34px;display:flex;align-items:center;justify-content:center;z-index:5}
.now{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top-left-radius:26px;border-top-right-radius:26px;box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:16px;z-index:4}
.now img{width:84px;height:84px;border-radius:16px;object-fit:cover}
.now .sp{flex:1;display:flex;justify-content:center}
.gear.in{position:static;width:60px;height:60px}
.pp{border:0;background:#2bb673;color:#fff;font-size:52px;width:110px;height:84px;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pp:active{transform:translateY(4px)}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#fff;border-radius:20px;padding:14px 22px;font-size:40px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9}
/* Version 10: Abspielansicht über den ganzen Bildschirm */
.player{position:fixed;left:0;top:0;right:0;bottom:0;background:#fff3d6;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:6;overflow:hidden}
.player .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.player .cv{position:relative;width:min(92vw,calc(100vh - 240px));height:min(92vw,calc(100vh - 240px));border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);pointer-events:none}
@supports (height:100dvh){.player .cv{width:min(92vw,calc(100dvh - 240px));height:min(92vw,calc(100dvh - 240px))}}
.player .cv img{width:100%;height:100%;object-fit:cover;display:block}
.player .cv .sym{right:4%;bottom:4%;width:24%;height:24%}
.player .ctrl{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.player .side{width:70px;height:70px;display:flex;align-items:center;justify-content:center}
.player .pp{width:150px;height:104px;font-size:64px}
/* Elternbereich */
.p{font-size:16px;-webkit-user-select:text;user-select:text}
.p h2{margin:22px 0 8px;font-size:20px}
.p input[type=text]{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:10px;margin:4px 0}
.p button{font-size:16px;padding:10px 14px;border-radius:10px;border:0;background:#2b6fb6;color:#fff;margin:4px 6px 4px 0}
.p button.gray{background:#888}
.p button.red{background:#c0392b}
.p .box{background:#fff;border-radius:14px;padding:12px;margin:10px 0}
.p code{background:#eee;padding:2px 5px;border-radius:5px;word-break:break-all}
.p .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.p .row img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.p .row span{flex:1;font-size:14px}
.p small{color:#666}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
  var SCOPES = 'user-read-playback-state user-modify-playback-state playlist-read-private';

  var DEFAULT_CFG = {
    clientId: '',
    deviceId: null,
    deviceName: '',
    series: [
      { id: 'bibi',  name: 'Bibi und Tina', query: 'Bibi und Tina Folge', filter: 'bibi', cover: null, albums: [] },
      { id: 'conni', name: 'Conni',         query: 'Conni Folge',         filter: 'conni', cover: null, albums: [], split: true },
      { id: 'peppa', name: 'Peppa Wutz',    query: 'Peppa Wutz',          filter: 'peppa', cover: null, albums: [] }
    ]
  };

  function load(k, d) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v || d; } catch (e) { return d; }
  }
  var cfg = load('hs_cfg', DEFAULT_CFG);
  if (!cfg.devices) cfg.devices = cfg.deviceId ? [{ id: cfg.deviceId, name: cfg.deviceName, type: 'Speaker' }] : [];
  var tok = load('hs_tok', {});
  function saveCfg() { localStorage.setItem('hs_cfg', JSON.stringify(cfg)); }
  function saveTok() { localStorage.setItem('hs_tok', JSON.stringify(tok)); }

  /* Version 7: Einstellungen aus der Zeit vor Version 5 kennen die Geschichten-Option noch nicht.
     Bei Conni wird sie dann eingeschaltet (ein bewusst entfernter Haken bleibt entfernt). */
  (function migrate() {
    var changed = false;
    (cfg.series || []).forEach(function (s) {
      if (s.id === 'conni' && s.split === undefined) { s.split = true; changed = true; }
      /* Version 12: Haken „Geschichten einzeln“ wird zur Auswahl play = 'album' | 'stories' | 'songs' */
      if (!s.play) { s.play = s.split ? 'stories' : 'album'; changed = true; }
    });
    if (changed) saveCfg();
  })();

  var state = { view: 'home', seriesId: null, now: null, playing: false, results: {}, devices: null, msg: '', backTo: 'home', lockUntil: 0 };

  var root = document.getElementById('app');

  /* ---------- kleine Helfer ---------- */
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'style') e.style.cssText = v;
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function form(o) {
    return Object.keys(o).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }).join('&');
  }
  function b64url(buf) {
    var s = '', b = new Uint8Array(buf);
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function findSeries(id) {
    for (var i = 0; i < cfg.series.length; i++) if (cfg.series[i].id === id) return cfg.series[i];
    return null;
  }
  function coverOf(s) { return s.cover || (s.albums[0] && s.albums[0].img) || ''; }
  function uriOf(a) { return a.uri || 'spotify:album:' + a.id; }
  function isAlbum(a) { return uriOf(a).indexOf('spotify:album:') === 0; }
  function tileContent(img, name) {
    return img ? h('img', { src: img }) : h('span', { class: 'tname' }, [name || '?']);
  }
  function playMode(s) { return (s && s.play) || (s && s.split ? 'stories' : 'album'); }
  function locked() { return Date.now() < (state.lockUntil || 0); }

  /* ---------- Spotify Login (PKCE) ---------- */
  async function login() {
    var rnd = new Uint8Array(48);
    crypto.getRandomValues(rnd);
    var ver = b64url(rnd);
    localStorage.setItem('hs_ver', ver);
    var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver));
    location.href = 'https://accounts.spotify.com/authorize?' + form({
      client_id: cfg.clientId, response_type: 'code', redirect_uri: REDIRECT,
      scope: SCOPES, code_challenge_method: 'S256', code_challenge: b64url(hash)
    });
  }
  async function tokenCall(params) {
    var r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form(params)
    });
    var j = await r.json();
    if (!j.access_token) throw new Error(j.error_description || j.error || 'Token-Fehler');
    tok = { access: j.access_token, refresh: j.refresh_token || tok.refresh, exp: Date.now() + j.expires_in * 1000 };
    saveTok();
  }
  async function handleRedirect() {
    var p = new URLSearchParams(location.search);
    var code = p.get('code');
    var err = p.get('error');
    if (code) {
      try {
        await tokenCall({ client_id: cfg.clientId, grant_type: 'authorization_code', code: code,
          redirect_uri: REDIRECT, code_verifier: localStorage.getItem('hs_ver') || '' });
        state.msg = 'Mit Spotify verbunden.';
      } catch (e) { state.msg = 'Login fehlgeschlagen: ' + e.message; }
      history.replaceState({}, '', REDIRECT);
      state.view = 'parent';
    } else if (err) {
      state.msg = 'Login abgebrochen: ' + err;
      history.replaceState({}, '', REDIRECT);
      state.view = 'parent';
    }
  }
  async function getToken() {
    if (tok.access && tok.exp > Date.now() + 60000) return tok.access;
    if (tok.refresh) {
      try {
        await tokenCall({ client_id: cfg.clientId, grant_type: 'refresh_token', refresh_token: tok.refresh });
      } catch (e) {
        if (/invalid|revoked|expired/i.test(e.message)) {
          tok = {}; saveTok();
          state.msg = 'Die Spotify-Verbindung ist abgelaufen. Bitte unten neu verbinden.';
        }
        throw e;
      }
      return tok.access;
    }
    throw new Error('Nicht angemeldet');
  }
  async function api(method, path, body) {
    var t = await getToken();
    var opt = { method: method, headers: { Authorization: 'Bearer ' + t } };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch('https://api.spotify.com/v1' + path, opt);
  }

  /* ---------- Abspielen ---------- */
  var toastEl = null;
  function toast(text) {
    if (toastEl) toastEl.remove();
    toastEl = h('div', { class: 'toast' }, [text]);
    document.body.appendChild(toastEl);
    setTimeout(function () { if (toastEl) { toastEl.remove(); toastEl = null; } }, 2500);
  }
  function devQ() { return cfg.deviceId ? '?device_id=' + encodeURIComponent(cfg.deviceId) : ''; }
  function devIcon(d) { return /smartphone|tablet/i.test(d.type || '') ? '📱' : /speaker|avr|stb|tv/i.test(d.type || '') ? '🔊' : '🎵'; }
  function currentDev() {
    for (var i = 0; i < cfg.devices.length; i++) if (cfg.devices[i].id === cfg.deviceId) return cfg.devices[i];
    return null;
  }
  /* Gerät neu suchen (IDs können sich ändern) und Wiedergabe dorthin holen */
  async function wakeDevice(play) {
    var d = currentDev();
    if (!d) return false;
    var r = await api('GET', '/me/player/devices');
    if (!r.ok) return false;
    var list = (await r.json()).devices || [];
    var f = list.filter(function (x) { return x.id === d.id; })[0] || list.filter(function (x) { return x.name === d.name; })[0];
    if (!f) return false;
    if (f.id !== d.id) { d.id = f.id; cfg.deviceId = f.id; cfg.deviceName = f.name; saveCfg(); }
    var t = await api('PUT', '/me/player', { device_ids: [f.id], play: !!play });
    return t.ok || t.status === 204;
  }
  async function switchDevice(d) {
    if (busy || d.id === cfg.deviceId) return;
    busy = true;
    cfg.deviceId = d.id; cfg.deviceName = d.name; saveCfg(); render();
    try {
      if (state.now) {
        var ok = await wakeDevice(state.playing);
        if (!ok) toast(devIcon(d) + '❓');
        else if (stopInfo && state.playing) scheduleStop(4000);
      }
    } catch (e) { toast(devIcon(d) + '❓'); }
    busy = false;
  }

  /* Version 10: große Abspielansicht öffnen bzw. verlassen */
  function openPlayer() {
    if (!state.now) return;
    if (state.view !== 'player') state.backTo = state.view;
    state.view = 'player';
    render();
    window.scrollTo(0, 0);
  }
  function leavePlayer() {
    state.view = state.backTo || 'home';
    if (state.view === 'player' || state.view === 'parent') state.view = 'home';
    state.lockUntil = Date.now() + 500; // kein versehentliches Antippen der Kachel unter dem Finger
    render();
    window.scrollTo(0, 0);
  }

  var busy = false;
  async function play(album, story, keepGoing) {
    if (busy) return;
    busy = true;
    try {
      var body = { context_uri: uriOf(album) };
      if (story) body.offset = { position: story.start };
      var r = await api('PUT', '/me/player/play' + devQ(), body);
      if (r.status === 404 && cfg.deviceId) {
        if (await wakeDevice(false)) {
          await sleep(1000);
          r = await api('PUT', '/me/player/play' + devQ(), body);
        } else { var cd = currentDev(); toast((cd ? devIcon(cd) : '🔊') + '❓'); busy = false; return; }
      }
      if (r.ok) {
        state.now = album; state.story = story || null; state.playing = true;
        stopInfo = (story && !keepGoing) ? { uri: uriOf(album), album: album, story: story } : null;
        if (stopInfo) scheduleStop(4000); else clearTimeout(stopTimer);
        if (state.view === 'parent') render(); else openPlayer();
      }
      else { toast('😕'); console.log('play status', r.status); }
    } catch (e) { toast('😕'); console.log(e); }
    busy = false;
  }

  /* Nach einer Geschichte anhalten: rechnet die Restzeit aus und prüft kurz vor Schluss */
  var stopTimer = null, stopInfo = null;
  function scheduleStop(ms) { clearTimeout(stopTimer); stopTimer = setTimeout(checkStop, ms); }
  async function pauseNow() {
    try { await api('PUT', '/me/player/pause' + devQ()); state.playing = false; render(); } catch (e) { console.log(e); }
  }
  async function checkStop() {
    var info = stopInfo;
    if (!info) return;
    try {
      var r = await api('GET', '/me/player');
      if (r.status === 204 || !r.ok) { if (r.status === 204) stopInfo = null; else scheduleStop(60000); return; }
      var j = await r.json();
      if (!j.context || j.context.uri !== info.uri || !j.item) { stopInfo = null; return; }
      var a = info.album, st = info.story;
      var idx = (a.trackIds || []).indexOf(j.item.id);
      if (idx < 0 && j.item.track_number) idx = j.item.track_number - 1;
      if (idx < st.start) { stopInfo = null; return; }
      if (idx > st.end) { if (j.is_playing) await pauseNow(); stopInfo = null; return; }
      if (!j.is_playing) { scheduleStop(60000); return; }
      var rem = (j.item.duration_ms || 0) - (j.progress_ms || 0);
      if (idx === st.end && rem < 15000) {
        clearTimeout(stopTimer);
        stopTimer = setTimeout(function () { if (stopInfo === info) { pauseNow(); stopInfo = null; } }, Math.max(rem - 400, 0));
        return;
      }
      for (var k = idx + 1; k <= st.end; k++) rem += (a.trackMs && a.trackMs[k]) || 0;
      scheduleStop(Math.max(Math.min(rem - 10000, 300000), 2000));
    } catch (e) { console.log(e); scheduleStop(60000); }
  }

  /* Titel eines Albums laden und Geschichten erkennen */
  async function loadTracks(a) {
    var out = [], url = '/albums/' + a.id + '/tracks?market=DE&limit=50&offset=0';
    for (var guard = 0; url && guard < 10; guard++) {
      var r = await api('GET', url);
      if (!r.ok) throw new Error('Titel laden fehlgeschlagen (' + r.status + ')');
      var j = await r.json();
      (j.items || []).forEach(function (t) { out.push({ id: t.id, name: t.name, ms: t.duration_ms || 0 }); });
      url = j.next ? j.next.replace('https://api.spotify.com/v1', '') : null;
    }
    return out;
  }
  var SV = 2; // Version der automatischen Erkennung; ältere automatische Ergebnisse werden einmal neu berechnet
  var PART = /[\s\-–:,(]*\b(teil|kapitel|part|track|abschnitt)\s*\d+\)?/gi;
  var INTRO = /intro|vorspann|titelsong|titellied|theme ?song/i;
  var OUTRO = /outro|abspann/i;
  function storyKey(name) {
    var br = /\[([^\]]+)\]/.exec(name);          // „In der Schule [Conni und der verschwundene Hund]“
    if (br) name = br[1];
    return name.toLowerCase().replace(/\([^)]*\)/g, ' ').replace(PART, ' ')   // „(Version 2025)“, „(3 Minutes Digital Version)“
      .replace(/^\s*\d+[\s.:\-–]*/, '').replace(/[\s\-–:.,]*\d+\s*$/, '')
      .replace(/[^a-zäöüß ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function storyName(name) { return name.replace(PART, '').replace(/^\s*\d+[\s.:\-–]*/, '').replace(/^[\s:\-–.,]+/, '').trim() || name; }
  /* Liefert die Titel-Positionen, an denen eine Geschichte beginnt.
     Intro-Lied gehört zur Geschichte danach, Outro-Lied zur Geschichte davor. */
  function detectStarts(tracks) {
    var starts = [0], last = null, open = true; // open = die nächste Geschichte hat ihren Startpunkt schon
    tracks.forEach(function (t, i) {
      var n = t.name || '';
      if (OUTRO.test(n) || (i > 0 && i === tracks.length - 1 && INTRO.test(n))) return;
      if (INTRO.test(n)) { if (i > 0 && !open) starts.push(i); open = true; last = null; return; }
      var k = storyKey(n);
      if (open) { open = false; if (k) last = k; return; }
      if (k && k !== last) starts.push(i);
      if (k) last = k;
    });
    return starts;
  }
  function buildStories(a, tracks, starts) {
    starts = starts.filter(function (x, i, arr) { return arr.indexOf(x) === i; }).sort(function (x, y) { return x - y; });
    if (starts[0] !== 0) starts.unshift(0);
    a.trackIds = tracks.map(function (t) { return t.id; });
    a.trackMs = tracks.map(function (t) { return t.ms; });
    a.sv = SV;
    a.stories = starts.map(function (st, i) {
      var first = st;
      while (first < tracks.length - 1 && INTRO.test(tracks[first].name || '')) first++;
      return { name: storyName(tracks[first].name), start: st, end: (i + 1 < starts.length ? starts[i + 1] : tracks.length) - 1 };
    });
  }
  var loadingAlbum = false;
  async function openAlbum(s, a) {
    if (loadingAlbum || busy) return;
    if (isAlbum(a) && (!a.stories || (!a.manualStories && a.sv !== SV))) {
      loadingAlbum = true;
      toast('⏳');
      try { var tr = await loadTracks(a); buildStories(a, tr, detectStarts(tr)); saveCfg(); }
      catch (e) {
        console.log(e);
        state.msg = 'Bei „' + a.name + '“ konnten die Geschichten nicht geladen werden: ' + e.message;
        loadingAlbum = false;
        return play(a);
      }
      loadingAlbum = false;
    }
    if (!a.stories || a.stories.length < 2) return play(a);
    state.storyMode = 'stories';
    state.view = 'stories'; state.albumUri = uriOf(a); state.lockUntil = Date.now() + 500; render(); window.scrollTo(0, 0);
  }
  /* Version 12: Musikalben – jedes Lied eine Kachel, nach dem Lied läuft das Album weiter */
  function songItems(a) { return (a.trackIds || []).map(function (id, i) { return { start: i, end: i }; }); }
  async function openSongs(s, a) {
    if (loadingAlbum || busy) return;
    if (!isAlbum(a)) return play(a);
    if (!a.trackIds) {
      loadingAlbum = true;
      toast('⏳');
      try { var tr = await loadTracks(a); a.trackIds = tr.map(function (t) { return t.id; }); a.trackMs = tr.map(function (t) { return t.ms; }); saveCfg(); }
      catch (e) {
        console.log(e);
        state.msg = 'Bei „' + a.name + '“ konnten die Lieder nicht geladen werden: ' + e.message;
        loadingAlbum = false;
        return play(a);
      }
      loadingAlbum = false;
    }
    if (a.trackIds.length < 2) return play(a);
    state.storyMode = 'songs';
    state.view = 'stories'; state.albumUri = uriOf(a); state.lockUntil = Date.now() + 500; render(); window.scrollTo(0, 0);
  }
  /* Version 9: Symbol wechselt sofort beim Tippen; schlägt der Befehl fehl, springt es zurück.
     403 heißt bei Spotify meist „ist schon so“ (z. B. schon pausiert) und zählt als Erfolg. */
  async function togglePlay() {
    if (busy) return;
    busy = true;
    var want = !state.playing;
    state.playing = want; render();
    try {
      var r = await api('PUT', '/me/player/' + (want ? 'play' : 'pause') + devQ());
      if (r.ok || r.status === 403) { if (want && stopInfo) scheduleStop(4000); }
      else { state.playing = !want; render(); toast('😕'); }
    } catch (e) { state.playing = !want; render(); toast('😕'); }
    busy = false;
  }

  /* Was läuft gerade? (nach Neuladen, wenn die Folge zu Ende ist usw.) */
  function findItem(uri) {
    for (var i = 0; i < cfg.series.length; i++)
      for (var k = 0; k < cfg.series[i].albums.length; k++)
        if (uriOf(cfg.series[i].albums[k]) === uri) return cfg.series[i].albums[k];
    return null;
  }
  async function syncPlayer() {
    if (!tok.refresh || busy || state.view === 'parent' || document.hidden) return;
    try {
      var r = await api('GET', '/me/player');
      if (r.status === 204) { state.playing = false; render(); return; }
      if (!r.ok) return;
      var j = await r.json();
      var uri = (j.context && j.context.uri) || '';
      var a = uri ? findItem(uri) : null;
      if (a) state.now = a;
      // Musik läuft weiter: Rahmen und Symbol auf das gerade laufende Lied setzen
      if (a && state.storyMode === 'songs' && state.story && j.item && a.trackIds) {
        var ti = a.trackIds.indexOf(j.item.id);
        if (ti >= 0) state.story = { start: ti, end: ti };
      }
      state.playing = !!j.is_playing && !!a;
      render();
    } catch (e) { console.log(e); }
  }

  /* Version 8: feste Farb-Form-Folge statt Ziffern – Geschichte 1 ist immer rot/Kreis usw.

  var SYMBOLS = [
    { color: '#e53935', shape: '<circle cx="50" cy="50" r="43"/>' },

  /* ---------- Elternbereich ---------- */
  function epNum(name) {
    var m = /(?:folge|fol\.?|episode|teil|nr\.?)\s*(\d+)/i.exec(name) || /\b(\d{1,3})\b/.exec(name);
    return m ? parseInt(m[1], 10) : 9999;
  }
  function sortAlbums(a) {
    return a.sort(function (x, y) {
      var d = epNum(x.name) - epNum(y.name);
      if (d) return d;
      return (x.date || '').localeCompare(y.date || '');
    });
  }
  async function search(s) {
    var found = {}, out = [], saved = {}, newest = '';
    var mode = s.mode || 'album';
    s.albums.forEach(function (a) { saved[a.id] = 1; if ((a.date || '') > newest) newest = a.date || ''; });
    state.msg = 'Suche läuft …'; render();
    try {
      var max = mode === 'artist' ? 20 : 100;
      for (var off = 0; off < max; off += 10) {
        var r = await api('GET', '/search?type=' + mode + '&market=DE&limit=10&offset=' + off + '&q=' + encodeURIComponent(s.query));
        if (!r.ok) { state.msg = 'Suche fehlgeschlagen (' + r.status + ')'; break; }
        var j = await r.json();
        var items = ((mode === 'artist' ? j.artists : j.albums) || {}).items || [];
        if (!items.length) break;
        items.forEach(function (a) {
          if (!a || found[a.id]) return;
          found[a.id] = 1;
          var hay = (a.name + ' ' + (a.artists || []).map(function (x) { return x.name; }).join(' ')).toLowerCase();
          var ok = !s.filter || hay.indexOf(s.filter.toLowerCase()) >= 0;
          // schon eingerichtet: Gespeichertes bleibt an, neu erschienene Folgen kommen dazu
          if (s.albums.length) ok = !!saved[a.id] || (mode === 'album' && ok && (a.release_date || '') > newest);
          if (mode === 'artist' && !s.albums.length) ok = false;
          out.push({ id: a.id, uri: 'spotify:' + mode + ':' + a.id, name: a.name,
            img: (a.images && a.images[0]) ? a.images[0].url : '', date: a.release_date || '', on: ok });
        });
        if (items.length < 10) break;
      }
      if (out.length) state.msg = out.length + ' Treffer gefunden.';
      else if (state.msg === 'Suche läuft …') state.msg = 'Keine Treffer. Suchbegriff ändern.';
    } catch (e) { state.msg = 'Fehler: ' + e.message; }
    state.results[s.id] = mode === 'album' ? sortAlbums(out) : out;
    render();
  }

  /* Spotify-Link (Album, Playlist, Künstler) direkt hinzufügen */
  async function addLink(s, text) {
    var m = /(album|playlist|artist)[\/:]([A-Za-z0-9]{22})/.exec(text || '');
    if (!m) { state.msg = 'Das ist kein Spotify-Link zu einem Album, einer Playlist oder einem Künstler.'; render(); return; }
    var kind = m[1], id = m[2];
    var names = { album: 'Album', playlist: 'Playlist', artist: 'Künstler' };
    var item = { id: id, uri: 'spotify:' + kind + ':' + id, name: names[kind], img: '', date: '', manual: true };
    try {
      var path = kind === 'playlist' ? '/playlists/' + id + '?fields=name,images' : '/' + kind + 's/' + id + '?market=DE';
      var r = await api('GET', path);
      if (r.ok) {
        var j = await r.json();
        item.name = j.name || item.name;
        item.img = (j.images && j.images[0]) ? j.images[0].url : '';
        item.date = j.release_date || '';
      }
    } catch (e) { console.log(e); }
    if (s.albums.some(function (a) { return uriOf(a) === item.uri; })) { state.msg = 'Ist schon drin.'; render(); return; }
    s.albums.push(item);
    saveCfg();
    state.msg = s.name + ': „' + item.name + '“ hinzugefügt' + (item.img ? '.' : ' (ohne Bild, die Kachel zeigt dann den Namen).');
    render();
  }

  async function loadDevices() {
    try {
      var r = await api('GET', '/me/player/devices');
      var j = await r.json();
      state.devices = j.devices || [];
      state.msg = state.devices.length ? '' : 'Keine Geräte gefunden. Spotify kurz auf dem Echo oder Handy starten und erneut versuchen.';
    } catch (e) { state.msg = 'Fehler: ' + e.message; }
    render();
  }

  function moveSeries(s, dir) {

        box.appendChild(h('div', { class: 'row' }, [cb, h('img', { src: a.img }), h('span', {}, [a.name + (a.date ? ' (' + a.date.slice(0, 4) + ')' : '')]),

        s.albums = others.concat(picked);
        if ((s.mode || 'album') === 'album') sortAlbums(s.albums);
        keep(); delete state.results[s.id]; state.msg = s.name + ': ' + s.albums.length + ' Kacheln gespeichert.'; render();

          h('span', {}, [a.name + (playMode(s) === 'stories' && a.stories ? ' – ' + a.stories.length + ' Geschichten' : '')]),
          (playMode(s) === 'stories' && isAlbum(a)) ? h('button', { onclick: function () { editStories(s, a); } }, ['Geschichten']) : null,
          h('button', { class: 'gray', onclick: function () { s.cover = a.img; saveCfg(); toast('🖼'); } }, ['Cover']),

          saveCfg(); render();
        });
        dbox.appendChild(h('label', { class: 'row' }, [cb, h('span', {}, [devIcon(d) + ' ' + d.name + ' (' + d.type + ')'])]));
      });
      p.appendChild(dbox);

      // 3. Hörspielreihen
      p.appendChild(h('h2', {}, ['3. Hörspielreihen und Musik']));
      p.appendChild(newSeriesBox());
      cfg.series.forEach(function (s) { p.appendChild(seriesEditor(s)); });

      p.appendChild(h('h2', {}, ['Sonstiges']));
      p.appendChild(h('button', { class: 'red', onclick: function () {
        tok = {}; saveTok(); state.devices = null; state.msg = 'Abgemeldet.'; render();
      } }, ['Von Spotify abmelden']));
      p.appendChild(h('div', {}, [h('small', {}, ['Version 12'])]));
    }
    out.push(p);
    return out;
  }

  /* ---------- Rendering ---------- */
  function renderView() {
    if (state.view === 'parent') return renderParent();
    if (state.view === 'player') return renderPlayer();
    if (state.view === 'series') return renderSeries();
    if (state.view === 'stories') return renderStories();
    state.view = 'home';
    return renderHome();
  }
  function render() {
    root.innerHTML = '';
    var parts = renderView();
    parts.forEach(function (n) { if (n) root.appendChild(n); });
    if (state.view !== 'parent' && state.view !== 'player') {
      var nb = nowBar();
      if (nb) root.appendChild(nb);
      else root.appendChild(gearLongPress());
    }
  }

  handleRedirect().then(render, render).then(syncPlayer);
  document.addEventListener('visibilitychange', syncPlayer);
  setInterval(syncPlayer, 120000);
})();
</script>
</body>
</html>
